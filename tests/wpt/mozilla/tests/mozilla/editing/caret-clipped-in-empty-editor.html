<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>An element-boundary caret respects its editor's overflow clip</title>
<link rel="match" href="caret-clipped-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>body { margin: 20px; font: 20px/20px Ahem; } #editor { width: 100px; height: 20px; overflow: hidden; caret-color: red; outline: none; } #marker { position: absolute; left: 140px; top: 20px; width: 20px; height: 20px; background: blue; }</style>
<div id="editor" contenteditable><br><br><br></div><div id="marker"></div>
<script>
(async () => {
  await document.fonts.load('20px Ahem');
  const editor = document.getElementById('editor');
  editor.focus();
  getSelection().collapse(editor, 2);
  editor.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
})();
</script>
