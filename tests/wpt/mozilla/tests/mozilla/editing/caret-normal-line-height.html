<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>An empty line uses the font's actual normal line height</title>
<link rel="match" href="caret-paragraph-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>body { margin: 20px; font: 20px Ahem; } #editor { width: 100px; caret-color: red; outline: none; }</style>
<div id="editor" contenteditable>XX<br><br></div>
<script>
(async () => {
  await document.fonts.load('20px Ahem');
  const editor = document.getElementById('editor');
  editor.focus();
  getSelection().collapse(editor, 3);
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
})();
</script>
