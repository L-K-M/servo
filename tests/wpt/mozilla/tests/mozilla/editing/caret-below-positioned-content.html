<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>A caret does not overpaint later positioned content</title>
<link rel="match" href="caret-overlay-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>body { margin: 20px; font: 20px/20px Ahem; } #editor { width: 100px; caret-color: red; outline: none; } #cover { position: absolute; z-index: 1; left: 40px; top: 20px; width: 1px; height: 20px; background: blue; }</style>
<div id="editor" contenteditable>XX</div><div id="cover"></div>
<script>
(async () => {
  await document.fonts.load('20px Ahem');
  const editor = document.getElementById('editor');
  editor.focus();
  getSelection().collapse(editor.firstChild, 1);
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
})();
</script>
