<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>An element-boundary caret uses its editor's content scroll node</title>
<link rel="match" href="caret-empty-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>body { margin: 20px; font: 20px/20px Ahem; } #editor { width: 100px; height: 20px; overflow: hidden; caret-color: red; outline: none; }</style>
<div id="editor" contenteditable><br><br><br></div>
<script>
(async () => {
  await document.fonts.load('20px Ahem');
  const editor = document.getElementById('editor');
  editor.focus();
  getSelection().collapse(editor, 1);
  editor.scrollTop = 20;
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
})();
</script>
