<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>Adjacent glyph runs do not cover the editing caret</title>
<link rel="match" href="caret-text-ref.html">
<link rel="stylesheet" href="/fonts/ahem.css">
<style>body { margin: 20px; font: 20px/20px Ahem; } #editor { width: 100px; caret-color: red; outline: none; }</style>
<div id="editor" contenteditable><span>X</span><span>X</span></div>
<script>
(async () => {
  await document.fonts.load('20px Ahem');
  const editor = document.getElementById('editor');
  editor.focus();
  getSelection().collapse(editor.firstChild.firstChild, 1);
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
})();
</script>
