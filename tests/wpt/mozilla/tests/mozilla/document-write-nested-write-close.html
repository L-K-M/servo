<!doctype html>
<meta charset="utf-8">
<title>document.close() inside a nested document.write() defers to the outermost write</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/#dom-document-close">
<link rel="help" href="https://html.spec.whatwg.org/multipage/#document.write()">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body><p>host page</p>
<script>
// The assertions read the text outside <script> elements: the written
// script's own source is textContent too, and its string literals would
// make an includes() check pass even if the nested write were dropped.
function visibleText() {
  return [...document.body.childNodes]
    .filter((n) => n.nodeType !== Node.ELEMENT_NODE || n.localName !== "script")
    .map((n) => n.textContent)
    .join("");
}

async_test(t => {
  window.addEventListener("load", t.step_func(() => {
    // The closing script runs at write() nesting depth 2: only the outermost
    // write() may run the deferred end of input, and trailing outer content
    // must still be parsed before it. The written script builds its nested
    // write from string concatenation so its source carries no script end
    // tag and needs no host variables.
    document.write(
      "<p>outer before</p><scr" + "ipt>" +
      "document.write('<p>inner body</p><scr' + 'ipt>document.close();</scr' + 'ipt>inner tail');" +
      "</scr" + "ipt><p>outer after</p>");
    assert_true(
      visibleText().includes("inner body"),
      "nested write content is parsed");
    assert_true(
      visibleText().includes("inner tail"),
      "content after the nested closing script is kept");
    assert_true(
      visibleText().includes("outer after"),
      "trailing outer content is parsed before the deferred close runs");
    assert_false(
      visibleText().includes("host page"),
      "the document open steps cleared the previous content");
    t.done();
  }), { once: true });
}, "document.close() inside a nested document.write() defers to the outermost write");
</script>
</body>
