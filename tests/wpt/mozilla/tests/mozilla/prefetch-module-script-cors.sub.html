<!doctype html>
<meta charset="utf-8">
<title>A speculatively fetched module script is fetched as a CORS request</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/#fetch-a-single-module-script">
<link rel="help" href="https://html.spec.whatwg.org/multipage/#speculative-html-parsing">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
  const t = async_test("A cross-origin module script after a parser-blocking script runs");
  window.moduleRan = false;
  window.moduleErrored = false;
  onload = t.step_func_done(() => {
    assert_false(window.moduleErrored, "module script error");
    assert_true(window.moduleRan, "module script ran");
  });
</script>
<!-- Blocks the parser, so the speculative parser fetches the module script below. -->
<script src="/common/slow.py?delay=1000"></script>
<script type="module" onerror="window.moduleErrored = true"
        src="http://{{hosts[][www]}}:{{ports[http][0]}}/_mozilla/mozilla/resources/module-cors-only-with-origin.py?{{uuid()}}"></script>
