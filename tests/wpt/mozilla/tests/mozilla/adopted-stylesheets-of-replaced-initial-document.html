<!doctype html>
<meta charset="utf-8">
<title>Adopted style sheets of a frame's replaced initial about:blank document</title>
<link rel="help" href="https://html.spec.whatwg.org/multipage/#initialise-the-document-object">
<link rel="help" href="https://drafts.csswg.org/cssom/#dom-documentorshadowroot-adoptedstylesheets">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/replaced-initial-document.js"></script>
<body>
<script>
const RED = "rgb(255, 0, 0)";

promise_test(async t => {
  const { frame, initialDocument } = frameWithInitialDocument(t);
  const sheet = new frame.contentWindow.CSSStyleSheet();
  sheet.replaceSync(`p { color: ${RED}; }`);
  await replaceInitialDocument(frame);

  initialDocument.adoptedStyleSheets = [sheet];
  assert_not_equals(colorOfParagraph(frame), RED);

  initialDocument.adoptedStyleSheets = [];
  assert_not_equals(colorOfParagraph(frame), RED);
}, "A sheet adopted by a replaced initial document does not style its replacement");

promise_test(async t => {
  const { frame, initialDocument } = frameWithInitialDocument(t);
  const sheet = new frame.contentWindow.CSSStyleSheet();
  sheet.replaceSync(`p { color: ${RED}; }`);
  initialDocument.adoptedStyleSheets = [sheet];
  await replaceInitialDocument(frame);

  initialDocument.adoptedStyleSheets = [];
  assert_array_equals(initialDocument.adoptedStyleSheets, []);
  assert_not_equals(colorOfParagraph(frame), RED);
}, "Removing a sheet adopted before the initial document was replaced");
</script>
