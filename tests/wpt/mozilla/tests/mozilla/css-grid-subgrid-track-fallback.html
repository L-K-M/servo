<!doctype html>
<meta charset="utf-8">
<title>subgrid tracks follow the parent grid's track list</title>
<link rel="help" href="https://drafts.csswg.org/css-grid/#subgrids">
<link rel="help" href="https://drafts.csswg.org/css-grid/#subgrid-items">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #parent {
    display: grid;
    grid-template-columns: [s] 100px [m] 100px [e];
    width: 200px;
  }
  #sub {
    grid-column: s / e;
    display: grid;
    grid-template-columns: subgrid;
  }
  #rparent {
    display: grid;
    grid-template-rows: [t] 50px [r] 50px [b];
    height: 100px;
    width: 300px;
  }
  #rsub {
    grid-row: t / b;
    display: grid;
    grid-template-rows: subgrid;
  }
</style>
<div id="parent">
  <div id="sub">
    <div id="probe-num" style="grid-column: 2; width: 20px; height: 20px"></div>
    <div id="probe-name" style="grid-column: m; width: 20px; height: 20px"></div>
    <div id="wide" style="grid-column: s; width: 350px; height: 20px; white-space: nowrap">wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww</div>
  </div>
</div>
<div id="rparent">
  <div id="rsub">
    <div id="tall" style="grid-row: 1; width: 10px; height: 300px"></div>
    <div id="probe-row" style="grid-row: 2; width: 10px; height: 10px"></div>
  </div>
</div>
<script>
test(t => {
  const sub = document.getElementById("sub");
  const probe = document.getElementById("probe-num");
  assert_approx_equals(
    probe.offsetLeft - sub.offsetLeft, 100, 1,
    "a child on line 2 sits after the parent's first 100px track, " +
    "not after a content-sized track");
}, "subgrid children place against the parent's column tracks");

test(t => {
  const sub = document.getElementById("sub");
  const probe = document.getElementById("probe-name");
  assert_approx_equals(
    probe.offsetLeft - sub.offsetLeft, 100, 1,
    "the parent's line m is the subgrid's line m");
}, "subgrid children place against the parent's column line names");

test(t => {
  const sub = document.getElementById("rsub");
  const probe = document.getElementById("probe-row");
  assert_approx_equals(
    probe.offsetTop - sub.offsetTop, 50, 1,
    "a child on row line 2 sits after the parent's first 50px track, " +
    "not after a content-sized track");
}, "subgrid children place against the parent's row tracks");
</script>
</body>
